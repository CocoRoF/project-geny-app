appId: dev.geny.app
productName: Geny
copyright: Apache-2.0
directories:
  output: release
  buildResources: build

# The renderer/main/preload bundles plus the baked Python tree. `resources/`
# is copied verbatim: the app resolves <resources>/python at runtime and
# copies it into the writable data root on first use (see runtime-locate.ts).
files:
  - out/**
  - package.json
  - '!node_modules/**'
extraResources:
  - from: resources/python
    to: python
  - from: resources/RUNTIME_VERSION
    to: RUNTIME_VERSION

asar: true
# Never compress the Python tree into the asar-unpacked path: thousands of
# tiny .py files decompress far slower than they read.
compression: normal

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # unsigned for now — the README tells the user to right-click → Open once
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch: [x64]
  # unsigned — SmartScreen shows "more info → run anyway" on first launch
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  # Without this the running window is not linked to the .desktop entry, so
  # the dock shows a generic icon and does not group the app's windows.
  syncDesktopName: true
  synopsis: An agent app — no server, no Docker
  # Sandbox on Linux, and why the default postinst is left alone:
  # Chromium needs either an unprivileged user namespace or a chrome-sandbox
  # at mode 4755 owned by root. Ubuntu 24.04 sets
  # kernel.apparmor_restrict_unprivileged_userns=1, which denies the former
  # to binaries with no AppArmor profile — so electron-builder ships one
  # (resources/apparmor-profile, granting `userns`) and its postinst installs
  # it. That is the right fix for the .deb and it is already in place.
  # The AppImage needs neither: measured on 24.04.4 it launches unmodified,
  # because Chromium takes the namespace path there. What DOES abort with
  # SIGTRAP is running `release/linux-unpacked/` directly — Chromium finds a
  # chrome-sandbox that is present but not SUID and refuses. That is a
  # build-tree artefact, not something a user ever runs, and the E2E scripts
  # pass --no-sandbox for exactly that reason.
  desktop:
    entry:
      Name: Geny
      Categories: Development;Utility;
      StartupWMClass: Geny

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0

publish:
  provider: github
  releaseType: release
