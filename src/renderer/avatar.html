<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      A looser policy than the main window's, and only here. The MMD runtime
      needs three things the chat UI never does:
        · wasm-unsafe-eval — the physics solver is WebAssembly
        · file: in img/media/connect — the model's textures live next to the
          .pmx in the user's own folder and are loaded by relative path
        · frame-src file: — a Live2D/Spine folder draws itself in its own
          page, because this app may not ship those runtimes
      The main window keeps `default-src 'self'`; nothing gained this here.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' blob: file:; connect-src 'self' data: blob: file:; worker-src 'self' blob:; frame-src file:" />
    <title>Geny Avatar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/avatar/main.tsx"></script>
  </body>
</html>
