[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geny-app-engine"
version = "0.1.0"
description = "App-side host layer around geny-executor (sidecar daemon, sessions, host services)"
requires-python = ">=3.12"
dependencies = ["geny-executor>=2.65.4"]

[tool.hatch.build.targets.wheel]
packages = ["geny_app"]
