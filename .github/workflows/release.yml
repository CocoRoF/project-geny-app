name: release

# Tag-driven: pushing v* builds installers for every platform and publishes
# them to a GitHub Release. `workflow_dispatch` builds the same artifacts
# without publishing, so the pipeline can be exercised before a tag exists.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The release is created ONCE, before the matrix fans out. Letting each
  # platform job create it races: whoever loses gets
  # 422 "already_exists" and fails after having built its installer
  # (observed on both macOS jobs in v0.1.0).
  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — reusing it"
          else
            gh release create "$tag" --draft --title "$tag" --notes-from-tag
          fi

  build:
    needs: [prepare]
    # tags publish; a manual run still builds, just without a release
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04       # glibc floor: a newer runner links symbols
            target: linux-x64      # that older distros do not have
          # one macOS runner builds BOTH arches (electron-builder.yml lists
          # arm64 and x64 for the dmg target), so a second macos-13 job just
          # rebuilt the same two dmgs and queued for a scarce runner
          - os: macos-14
            target: darwin-arm64
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer/main/preload
        run: npm run build

      # The Python engine is baked into resources/ here, per platform. This
      # is what makes the installer self-contained: no interpreter to find,
      # no pip at first run, works offline.
      - name: Bundle Python engine
        env:
          BUNDLE_TARGET: ${{ matrix.target }}
        run: node scripts/bundle-python.mjs

      - name: Verify the bundled engine actually runs
        shell: bash
        run: node scripts/verify-bundle.mjs

      - name: Package installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EB_PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        shell: bash
        run: npx electron-builder --publish "$EB_PUBLISH"

      - uses: actions/upload-artifact@v4
        with:
          name: geny-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn
          retention-days: 14

  # Only flip the release visible once every platform has landed — a
  # half-populated release is worse than a late one.
  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --json assets \
            -q '.assets[].name' | sed 's/^/  · /'
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
